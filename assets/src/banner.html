<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile banner</title>
<style>
@font-face { font-family: "Nunito Sans"; src: url("fonts/nunito-sans-latin-wght-normal.woff2") format("woff2"); font-weight: 200 1000; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1600px; height: 420px; }
body {
    position: relative; overflow: hidden; font-family: "Nunito Sans", "Helvetica Neue", Arial, sans-serif; color: #fff;
    background:
        radial-gradient(760px 380px at 90% -10%, rgba(41, 197, 232, 0.30), transparent 62%),
        radial-gradient(700px 440px at -4% 115%, rgba(26, 143, 209, 0.36), transparent 60%),
        #14202e;
}
/* faint grid, fading out towards the edges */
body::before {
    content: ""; position: absolute; inset: 0; opacity: 0.55;
    background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 52px 52px;
    -webkit-mask-image: radial-gradient(ellipse 70% 90% at 45% 45%, #000 25%, transparent 85%);
}
body::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: linear-gradient(90deg, #1a8fd1, #29c5e8); }
.text { position: absolute; left: 110px; top: 50%; transform: translateY(-52%); }
.pill { display: inline-flex; align-items: center; gap: 12px; padding: 9px 22px; border-radius: 99px; background: rgba(41, 197, 232, 0.1); border: 1.5px solid rgba(41, 197, 232, 0.38); color: #bfeefa; font-size: 22px; font-weight: 700; }
.pill i { width: 11px; height: 11px; border-radius: 50%; background: #3ddc97; box-shadow: 0 0 0 6px rgba(61, 220, 151, 0.2); }
h1 { margin-top: 26px; font-size: 92px; line-height: 1; font-weight: 800; letter-spacing: -0.025em; }
.role { margin-top: 18px; font-size: 40px; font-weight: 700; color: #29c5e8; }
.line { margin-top: 18px; font-size: 27px; font-weight: 600; color: #aebfce; letter-spacing: 0.01em; }
.line b { color: #fff; font-weight: 700; }
.line span { margin: 0 12px; color: #4f6a80; }
.portrait { position: absolute; right: 150px; top: 50%; width: 270px; height: 270px; transform: translateY(-50%); }
.portrait::before { content: ""; position: absolute; inset: -18px; border-radius: 50%; background: conic-gradient(from 140deg, #29c5e8, #1a8fd1, transparent 55%, #29c5e8); opacity: 0.9; }
.portrait::after { content: ""; position: absolute; inset: -40px; border-radius: 50%; border: 1.5px dashed rgba(255, 255, 255, 0.18); }
.portrait img { position: relative; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 8px solid #14202e; box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5); display: block; }
</style>
</head>
<body>
    <div class="text">
        <div class="pill"><i></i> Open to new projects and opportunities</div>
        <h1>Saravanan Kaliannan</h1>
        <div class="role">React Full Stack Developer</div>
        <div class="line"><b>Web</b><span>·</span><b>Mobile</b><span>·</span><b>AI</b><span>·</span>9+ years building products</div>
    </div>
    <div class="portrait"><img src="photo.jpg" alt=""></div>
</body>
</html>
